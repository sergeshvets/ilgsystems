<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>Секретная миссия</title>
<meta property="og:title" content="Секретная миссия">
<meta property="og:description" content="Задание только для тебя.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sea:#06222b;--deep:#04171d;--foam:#0f4a52;--gold:#f2b84b;--coral:#ff6b5a;--ink:#e9f3ee;--mute:#92b6b2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--foam),var(--sea) 55%,var(--deep)) fixed;color:var(--ink);font:17px/1.55 Manrope,system-ui,sans-serif;overflow-x:hidden}
.stage{display:none;min-height:100svh;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px;gap:20px}
.stage.on{display:flex;animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
h1{font:700 clamp(26px,7.5vw,40px)/1.15 Unbounded,system-ui,sans-serif;margin:0;letter-spacing:-.01em;max-width:14em}
h2{font:700 clamp(21px,5.8vw,28px)/1.25 Unbounded,system-ui,sans-serif;margin:0;max-width:16em}
p{margin:0;max-width:30em;color:var(--mute)}
.msg{min-height:3.2em;font-size:16px;max-width:22em}
.msg.good{color:var(--gold)}.msg.bad{color:var(--coral)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.dots{display:flex;gap:8px}
.dots b{width:10px;height:10px;border-radius:50%;background:var(--foam)}
.dots b.on{background:var(--gold)}
.opts{display:grid;gap:12px;width:100%;max-width:380px}
.opt{padding:15px 18px;border-radius:14px;border:1.5px solid var(--foam);background:rgba(255,255,255,.05);color:var(--ink);font:600 17px Manrope,sans-serif;cursor:pointer}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--gold);color:#2a1c00;border-color:var(--gold)}
.opt.bad{border-color:var(--coral);color:var(--coral);background:rgba(255,107,90,.08);opacity:.75}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* sonar - the one big moment */
.sonar{position:relative;width:min(80vw,350px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;
 background:repeating-radial-gradient(circle,transparent 0 34px,rgba(242,184,75,.14) 35px 36px)}
.sonar::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(242,184,75,.38),transparent 26%);animation:spin 4s linear infinite}
.sonar i{position:absolute;inset:0;border:1.5px solid var(--gold);border-radius:50%;opacity:0;animation:ping 3.6s cubic-bezier(.2,.6,.3,1) infinite}
.sonar i:nth-child(2){animation-delay:1.2s}.sonar i:nth-child(3){animation-delay:2.4s}
@keyframes ping{0%{transform:scale(.25);opacity:.9}100%{transform:scale(1);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.go{position:relative;z-index:2;width:52%;aspect-ratio:1;border-radius:50%;border:0;background:var(--gold);color:#2a1c00;font:700 clamp(13px,3.9vw,16px)/1.25 Unbounded,sans-serif;padding:14px;cursor:pointer;box-shadow:0 0 0 8px rgba(242,184,75,.18),0 0 50px rgba(242,184,75,.5)}
.go:active{transform:scale(.96)}

/* hold-to-scan */
.scan{position:relative;width:190px;height:190px;border:0;background:none;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:var(--ink)}
.scan svg{width:100%;height:100%;transform:rotate(-90deg)}
.scan span{position:absolute;inset:0;display:grid;place-items:center;font:600 18px Unbounded,sans-serif;pointer-events:none}

/* finale */
.trophy{font-size:64px;line-height:1}
.prize{max-width:380px;padding:26px 22px;border-radius:22px;border:1.5px solid var(--gold);background:var(--deep);font:700 clamp(19px,5.4vw,24px)/1.35 Unbounded,sans-serif;color:var(--gold);box-shadow:0 0 60px rgba(242,184,75,.25)}
#cf{position:fixed;inset:0;pointer-events:none;display:none;z-index:9}
@media (prefers-reduced-motion:reduce){.sonar::after,.sonar i{animation:none}.stage.on{animation:none}}
</style>
</head>
<body>
<main>
  <section class="stage on" id="s0">
    <h1><span data-name></span>, у тебя секретная миссия</h1>
    <div class="sonar"><i></i><i></i><i></i><button class="go" id="start">Для поиска сокровища жми сюда</button></div>
    <p>Задание только для тебя</p>
  </section>

  <section class="stage" id="s1">
    <div class="dots" id="dots" aria-hidden="true"></div>
    <p id="qn"></p>
    <h2 id="qt"></h2>
    <div class="opts" id="opts"></div>
    <p class="msg" id="qmsg"></p>
  </section>

  <section class="stage" id="s2">
    <h1>Включи сканер</h1>
    <p>Осталось последнее испытание. Зажми кнопку и держи, пока сканер не расшифрует сигнал.</p>
    <button class="scan" id="scan" aria-label="Зажми и держи">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="rgba(255,255,255,.04)" stroke="#0f4a52" stroke-width="8"/><circle id="ring" cx="60" cy="60" r="54" fill="none" stroke="#f2b84b" stroke-width="8" stroke-linecap="round"/></svg>
      <span>держи</span>
    </button>
    <p class="msg" id="scanmsg">Жду сигнала…</p>
  </section>

  <section class="stage" id="s3">
    <div class="trophy">🏆</div>
    <h1>Поздравляем!</h1>
    <div class="prize" id="prize"></div>
    <p id="sign"></p>
  </section>
</main>
<canvas id="cf"></canvas>

<script>
/* ====== ЗДЕСЬ МЕНЯЕШЬ ТЕКСТЫ, ВОПРОСЫ И ОТВЕТЫ ====== */
const CONFIG = {
  name: "Милка",
  final: "Ваши ментоловые Montego находятся в подлокотнике белого кресла 🏴‍☠️",
  sign: "С любовью, твой Серж ❤️",
  shuffle: true   // перемешивать варианты ответов (true / false)
};
/* ok:true - правильный ответ, say - реакция на выбор */
const STEPS = [
  { q: "Кто самый красивый человек на планете?", o: [
    { t: "Милка", ok: 1, say: "Единогласно. Комиссия подтверждает." },
    { t: "Брэд Питт", say: "Красивый, но не настолько. Попробуй ещё." },
    { t: "Серж", say: "Он скромно промолчит. Выбери другой ответ." }
  ]},
  { q: "Когда была наша свадьба?", o: [
    { t: "2 ноября 2024", ok: 1, say: "Самый счастливый день. Верно! 💍" },
    { t: "20 апреля", say: "В этот день родилась Милка. Дата важная, но не свадьба." },
    { t: "11 января", say: "Это мой день рождения. Подарки принимаются, но свадьба не тогда." },
    { t: "14 декабря 2024", say: "В этот день ты приехала в Штаты. Тоже праздник, но свадьба была раньше." }
  ]},
  { q: "Когда был наш первый поцелуй?", o: [
    { t: "31 марта 2023", ok: 1, say: "Помнишь! Верно 💋" },
    { t: "2 ноября 2024", say: "К свадьбе мы уже целовались, и не раз." },
    { t: "14 декабря 2024", say: "Нет, так долго ждать я бы не смог." },
    { t: "11 января", say: "Мой день рождения. Приятно, но поцелуй был в другой день." }
  ]},
  { q: "В какую страну ты выехала первой, когда ехала из Украины ко мне?", o: [
    { t: "Словакия", ok: 1, say: "Да! Первая граница на пути ко мне 🇸🇰" },
    { t: "Венгрия", say: "Близко, но мимо. Попробуй ещё." },
    { t: "Румыния", say: "Тоже сосед, но не тот. Подумай, откуда ты ехала." },
    { t: "Молдова", say: "Почти, но нет." }
  ]},
  { scan: true },
  { q: "Какой подарок получил муж, а достался всей семье бесплатно?", o: [
    { t: "Белое кресло", ok: 1, say: "Это оно! Миссия почти выполнена." },
    { t: "Духи Valentino", say: "Пахнет приятно, но это не тот подарок." },
    { t: "Шарики-цифры", say: "Красиво, но это не тот подарок." }
  ]}
];
/* ================================================ */

const $ = id => document.getElementById(id);
const buzz = p => navigator.vibrate && navigator.vibrate(p);
const TOTAL = STEPS.filter(s => s.q).length;
let n = 0;
STEPS.forEach(s => { if (s.q) s.n = ++n; });
document.querySelectorAll("[data-name]").forEach(e => e.textContent = CONFIG.name);
$("prize").textContent = CONFIG.final;
$("sign").textContent = CONFIG.sign;

function show(id){
  document.querySelectorAll(".stage").forEach(s => s.classList.toggle("on", s.id === id));
  scrollTo(0, 0);
}

/* звук без файлов */
let AC;
function tone(seq){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    seq.forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.18, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(AC.destination);
      o.start(t); o.stop(t + d); t += d * .8;
    });
  }catch(e){}
}

/* шаги квеста */
let cur = 0, locked = false;
function next(i){
  cur = i;
  const st = STEPS[i];
  if (!st) return finish();
  if (st.scan) return show("s2");
  $("qn").textContent = "Вопрос " + st.n + " из " + TOTAL;
  $("dots").innerHTML = Array.from({length: TOTAL}, (_, k) => '<b class="' + (k < st.n ? "on" : "") + '"></b>').join("");
  $("qt").textContent = st.q;
  const msg = $("qmsg"); msg.className = "msg"; msg.textContent = "";
  const box = $("opts"); box.innerHTML = "";
  const list = st.o.slice();
  if (CONFIG.shuffle) for (let k = list.length - 1; k > 0; k--){ const j = Math.random() * (k + 1) | 0; [list[k], list[j]] = [list[j], list[k]]; }
  list.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o.t; b.onclick = () => pick(b, o);
    box.appendChild(b);
  });
  show("s1");
}
function pick(b, o){
  if (locked) return;
  const msg = $("qmsg");
  if (o.ok){
    locked = true; b.classList.add("ok");
    msg.className = "msg good"; msg.textContent = o.say || "Верно!";
    tone([[523,.15],[659,.15],[784,.3]]); buzz(60);
    setTimeout(() => { locked = false; next(cur + 1); }, 1700);
  }else{
    b.classList.add("bad"); b.disabled = true;
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    msg.className = "msg bad"; msg.textContent = o.say || "Не то. Попробуй ещё.";
    tone([[196,.28]]);
  }
}

/* сканер: зажми и держи 3 секунды */
(function(){
  const btn = $("scan"), ring = $("ring"), out = $("scanmsg"), C = 2 * Math.PI * 54;
  let p = 0, held = false, done = false, last = performance.now(), tick = 0;
  ring.style.strokeDasharray = C; ring.style.strokeDashoffset = C;
  const on = e => { e.preventDefault(); held = true; try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); }catch(_){} };
  const off = () => { held = false; };
  btn.addEventListener("pointerdown", on);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, off));
  btn.addEventListener("contextmenu", e => e.preventDefault());
  (function loop(t){
    const dt = Math.min(50, t - last); last = t;
    if (!done){
      p = Math.max(0, Math.min(1, p + (held ? dt / 3000 : -dt / 1200)));
      ring.style.strokeDashoffset = C * (1 - p);
      if (held && t - tick > 450){ tick = t; tone([[300 + p * 500, .08]]); buzz(20); }
      out.className = "msg";
      out.textContent = held ? (p < .33 ? "Сигнал слабый…" : p < .66 ? "Теплее…" : "Очень горячо…")
                             : (p > .02 ? "Не отпускай!" : "Жду сигнала…");
      if (p >= 1){
        done = true; out.className = "msg good"; out.textContent = "Сигнал расшифрован!";
        tone([[523,.12],[659,.12],[784,.12],[1047,.4]]); buzz([80,60,200]);
        setTimeout(() => next(cur + 1), 1000);
      }
    }
    requestAnimationFrame(loop);
  })(last);
})();

/* финал */
function finish(){
  show("s3");
  tone([[523,.12],[659,.12],[784,.12],[1047,.18],[784,.12],[1047,.6]]); buzz([100,60,100,60,300]);
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const c = $("cf"), x = c.getContext("2d"), cols = ["#f2b84b", "#ff6b5a", "#e9f3ee", "#4fd1c5"];
  c.width = innerWidth; c.height = innerHeight; c.style.display = "block";
  const P = Array.from({length: 170}, () => ({
    x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5,
    vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 8,
    r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.random() * 4 | 0]
  }));
  const t0 = performance.now();
  (function f(t){
    x.clearRect(0, 0, c.width, c.height);
    P.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += .04; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
      x.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .6); x.restore();
    });
    if (t - t0 < 5500) requestAnimationFrame(f); else c.style.display = "none";
  })(t0);
}

$("start").onclick = () => { tone([[392,.12],[587,.25]]); buzz(40); next(0); };
</script>
</body>
</html>
